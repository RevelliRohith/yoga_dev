<!-- PROPOSAL ONLY: not applied. Requires approval for Auth template settings.
     Change the exact origin below to the approved APP_SITE_URL before production use.
     Non-trainer recovery destinations retain Supabase's existing confirmation flow. -->
<h2>Set a new password</h2>
{{ if eq .RedirectTo "http://localhost:3000/auth/trainer/confirm" }}
<p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">Continue to reset your trainer password</a></p>
{{ else }}
<p><a href="{{ .ConfirmationURL }}">Reset password</a></p>
{{ end }}
<p>If you did not request this, you can ignore this email.</p>
